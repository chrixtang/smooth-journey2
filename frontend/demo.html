<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="Smooth Journey: a student concept prototype for joined-up airport and in-flight assistance, with AI and passenger-controlled privacy. Fictional data.">
<meta property="og:title" content="Smooth Journey">
<meta property="og:description" content="Smooth Journey: a student concept prototype for joined-up airport and in-flight assistance, with AI and passenger-controlled privacy. Fictional data.">
<meta name="robots" content="noindex">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='14' fill='%230f5e55'/%3E%3Cpath d='M16 2a14 14 0 0 1 13.3 18.3L16 16z' fill='%23f2c12e'/%3E%3Ccircle cx='16' cy='16' r='7' fill='%23fff'/%3E%3C/svg%3E">
<title>Smooth Journey</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Sans+HK:wght@400;500;700&display=swap" rel="stylesheet">
<style>
/* Layout: a demo stage of device mock-ups (phones, crew tablet, ops dashboard) under a sticky control bar. Deliberately single light theme: it imitates real device screens. */
:root{
  color-scheme:light;
  --jade:#0f5e55; --jade-d:#0a463f; --jade-2:#e4f0ec; --jade-3:#c7e1d9;
  --ink:#14201e; --muted:#5b6a66; --line:#dbe4e0; --bg:#e9eeec; --card:#ffffff;
  --sun:#f2c12e; --sun-2:#fff4cf; --red:#c0392b; --red-2:#fde8e5; --amber:#a86800; --amber-2:#fff1d6;
  --ok:#1d7f48; --ok-2:#e0f3e8; --night:#0e1a24; --night-2:#18293a; --bar:#13221f; --bar-2:#24403a;
  --violet:#4b3fa8; --violet-2:#ecebfb;
  --font:Inter,"Noto Sans HK",system-ui,-apple-system,"Segoe UI",sans-serif;
  --font-zh:"Noto Sans HK",Inter,"PingFang HK","Microsoft JhengHei",sans-serif;
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--bg);color:var(--ink);font-family:var(--font);-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:60;background:#fff}
button{font:inherit;cursor:pointer;border:0;background:none;color:inherit}
button:disabled{cursor:not-allowed;opacity:.45}
textarea,input{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--sun);outline-offset:2px;border-radius:6px}
.zh{font-family:var(--font-zh)}
h1,h2,h3{text-wrap:balance}

/* top bar */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:50;background:#fff;border-bottom:1px solid var(--line)}
.topin{display:flex;align-items:center;gap:12px 16px;flex-wrap:wrap;padding-block:10px;padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:max(20px,env(safe-area-inset-right,0px))}
.brand{display:flex;align-items:center;gap:10px;font-weight:800;font-size:17px;letter-spacing:-.01em;flex-wrap:wrap}
.logo{width:28px;height:28px;border-radius:50%;background:conic-gradient(var(--jade) 0 60%,var(--sun) 60% 100%);display:inline-block;position:relative;flex:0 0 28px}
.logo::after{content:"";position:absolute;inset:7px;border-radius:50%;background:#fff}
.tag{font-size:11px;font-weight:600;color:var(--muted);border:1px solid var(--line);border-radius:999px;padding:3px 8px;line-height:1.35}
.aist{font-size:11px;font-weight:700;border-radius:999px;padding:4px 9px;white-space:nowrap}
.aist.live{background:var(--violet-2);color:var(--violet)}
.aist.off{background:#eef1f0;color:var(--muted)}
.tabs{display:flex;gap:4px;flex-wrap:wrap;margin-left:auto}
.tabs button{padding:8px 11px;border-radius:8px;font-size:13px;font-weight:600;color:var(--muted)}
.tabs button.on{background:var(--jade);color:#fff}
.demobar{background:var(--bar);color:#cfe3dc;font-size:12px}
.demoin{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding-block:8px;padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:max(20px,env(safe-area-inset-right,0px))}
.demobar b{color:#fff;font-weight:700;margin-right:4px}
.demobar button{background:var(--bar-2);color:#fff;padding:6px 10px;border-radius:6px;font-size:12px;font-weight:600}
.demobar button.hl{background:var(--sun);color:#1b1b1b}
.demobar .sp{flex:1}
body.clean .demobar{display:none}

main{padding-block:24px 60px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.stage{display:flex;gap:28px;justify-content:center;align-items:flex-start;flex-wrap:wrap}
.phonewrap{display:flex;flex-direction:column;align-items:center;gap:10px;max-width:100%}
.plabel{font-size:13px;font-weight:700;color:var(--muted);display:flex;gap:8px;align-items:center}
.plabel .dot{width:8px;height:8px;border-radius:50%;background:var(--jade)}
.phone{width:372px;max-width:100%;height:780px;background:#fff;border-radius:44px;border:10px solid #111;box-shadow:0 30px 60px -20px rgba(10,40,35,.35);position:relative;overflow:hidden;display:flex;flex-direction:column}
.phone.big{transform:scale(1.08);transform-origin:top center;margin-bottom:60px}
.sbar{height:34px;flex:0 0 34px;display:flex;justify-content:space-between;align-items:center;padding:0 22px;font-size:12px;font-weight:700;font-variant-numeric:tabular-nums}
.pbody{flex:1;overflow-y:auto;overflow-x:hidden;scrollbar-width:none;padding-bottom:12px}
.pbody::-webkit-scrollbar{display:none}
.ptabs{flex:0 0 64px;border-top:1px solid var(--line);display:flex;justify-content:space-around;align-items:center;background:#fff;padding-bottom:4px}
.ptabs button{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:10.5px;font-weight:600;color:var(--muted);padding:4px 2px;min-width:52px}
.ptabs button .ic{font-size:18px;line-height:1}
.ptabs button.on{color:var(--jade)}

.pad{padding:14px 18px}
.hdr{padding:6px 18px 12px}
.hdr h1{font-size:24px;font-weight:800;letter-spacing:-.02em;line-height:1.15}
.hdr p{color:var(--muted);font-size:14px;margin-top:4px}
.back{font-size:14px;font-weight:600;color:var(--jade);padding:4px 18px 0;display:block;cursor:pointer;text-align:left}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:14px;margin:0 18px 12px}
.card.jade{background:var(--jade);color:#fff;border-color:var(--jade)}
.card.soft{background:var(--jade-2);border-color:var(--jade-3)}
.card.sun{background:var(--sun-2);border-color:#f0dc95}
.card.warn{background:var(--amber-2);border-color:#f1d39b}
.card.bad{background:var(--red-2);border-color:#f2c0b9}
.card.ai{background:var(--violet-2);border-color:#d3cff3}
.card h3{font-size:16px;font-weight:700;margin-bottom:4px}
.card p{font-size:14px;line-height:1.45}
.small{font-size:12px;color:var(--muted);line-height:1.45}
.card.jade .small{color:#bfe0d7}
.row{display:flex;align-items:center;gap:10px}
.between{justify-content:space-between}
.btn{display:block;width:100%;background:var(--jade);color:#fff;font-weight:700;font-size:16px;padding:14px;border-radius:14px;text-align:center}
.btn.sec{background:var(--jade-2);color:var(--jade)}
.btn.sun{background:var(--sun);color:#1b1b1b}
.btn.red{background:var(--red);color:#fff}
.btn.ghost{background:#fff;border:1.5px solid var(--line);color:var(--ink)}
.btn.ai{background:var(--violet);color:#fff}
.btn.sm{font-size:14px;padding:10px;border-radius:10px}
.mt{margin-top:10px}.mt2{margin-top:16px}
.pill{white-space:nowrap;flex:0 0 auto;display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:700;padding:4px 9px;border-radius:999px;background:var(--jade-2);color:var(--jade)}
.pill.ok{background:var(--ok-2);color:var(--ok)}
.pill.amber{background:var(--amber-2);color:var(--amber)}
.pill.red{background:var(--red-2);color:var(--red)}
.pill.grey{background:#eef1f0;color:var(--muted)}
.pill.ai{background:var(--violet-2);color:var(--violet)}
.code{font-family:var(--mono);font-weight:800;font-size:13px;background:var(--ink);color:#fff;border-radius:6px;padding:3px 7px;flex:0 0 auto}
.codes{display:flex;gap:6px;flex-wrap:wrap}
.list{list-style:none}
.list li{display:flex;gap:10px;padding:10px 0;border-top:1px solid var(--line);font-size:14px;align-items:flex-start;line-height:1.4}
.list li:first-child{border-top:0}
.chk{width:22px;height:22px;border-radius:50%;flex:0 0 22px;display:grid;place-items:center;font-size:12px;font-weight:800;background:#eef1f0;color:var(--muted)}
.chk.ok{background:var(--ok);color:#fff}
.chk.now{background:var(--sun);color:#1b1b1b}
.chk.bad{background:var(--red);color:#fff}
textarea.big{width:100%;min-height:150px;border:1.5px solid var(--line);border-radius:14px;padding:12px;font-size:15px;line-height:1.45;resize:vertical;background:#fbfcfc}
textarea.big[readonly]{background:#f3f6f5;color:var(--muted)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{font-size:13px;font-weight:600;padding:7px 11px;border-radius:999px;border:1.5px solid var(--line);background:#fff;text-align:left}
.chip.on{border-color:var(--jade);background:var(--jade-2);color:var(--jade)}
.sw{width:46px;height:28px;border-radius:999px;background:#c9d3d0;position:relative;flex:0 0 46px;transition:background .2s}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;transition:left .2s;box-shadow:0 1px 3px rgba(0,0,0,.2)}
.sw[aria-checked="true"]{background:var(--jade)}
.sw[aria-checked="true"]::after{left:21px}
.swrow{display:flex;gap:12px;align-items:center;padding:11px 0;border-top:1px solid var(--line)}
.swrow:first-of-type{border-top:0}
.swrow .tx{flex:1;min-width:0}
.swrow .tx b{display:block;font-size:14px}
.redact{background:#eef1f0;border-radius:12px;padding:10px;font-size:13.5px;line-height:1.5;white-space:pre-wrap;word-break:break-word}
.redact mark{background:var(--ink);color:#fff;border-radius:4px;padding:0 4px;font-size:12px;font-family:var(--mono)}
.consent{display:flex;gap:10px;align-items:flex-start;font-size:14px;line-height:1.4;padding:10px;border-radius:12px;background:#fff;border:1.5px solid var(--line);cursor:pointer;text-align:left;width:100%}
.consent.on{border-color:var(--jade);background:var(--jade-2)}
.box{width:22px;height:22px;flex:0 0 22px;border-radius:6px;border:2px solid var(--muted);display:grid;place-items:center;font-weight:800;color:#fff;font-size:13px}
.consent.on .box{background:var(--jade);border-color:var(--jade)}
pre.export{background:#0f1c1a;color:#d6efe7;border-radius:12px;padding:12px;font-size:11px;line-height:1.45;overflow:auto;max-height:260px;white-space:pre-wrap;word-break:break-word}

.tl{position:relative;padding-left:8px}
.tl .st{display:flex;gap:12px;position:relative;padding-bottom:16px}
.tl .st:not(:last-child)::before{content:"";position:absolute;left:10px;top:24px;bottom:0;width:2px;background:var(--line)}
.tl .st.done:not(:last-child)::before{background:var(--ok)}
.tl .st .t{font-size:14px;font-weight:700}
.tl .st .s{font-size:12px;color:var(--muted);margin-top:2px}
.tl .st.now .t{color:var(--jade)}

.toasts{position:absolute;top:40px;left:10px;right:10px;display:flex;flex-direction:column;gap:6px;z-index:20;pointer-events:none}
.toast{background:rgba(20,32,30,.96);color:#fff;border-radius:16px;padding:11px 13px;font-size:13px;line-height:1.35;box-shadow:0 10px 25px -8px rgba(0,0,0,.4)}
.toast.new{animation:drop .35s ease}
.toast b{display:block;font-size:11px;color:var(--sun);letter-spacing:.04em;text-transform:uppercase;margin-bottom:2px}
@keyframes drop{from{transform:translateY(-14px);opacity:0}to{transform:none;opacity:1}}

.night{background:var(--night);color:#e7eef5;min-height:100%}
.night .card{background:var(--night-2);border-color:#273c51;color:#e7eef5}
.night .small{color:#93a6b8}
.phases{display:flex;gap:4px;margin:0 18px 12px}
.phases span{flex:1;font-size:10px;font-weight:700;text-align:center;padding:6px 0;border-radius:6px;background:#1f3245;color:#7f95aa}
.phases span.done{background:#2b4a63;color:#cfe0ee}
.phases span.on{background:var(--sun);color:#1b1b1b}
.breath{width:150px;height:150px;margin:8px auto 4px;border-radius:50%;background:radial-gradient(circle,#5fd0bb 0,#1f7d70 70%);animation:breath 8s ease-in-out infinite;display:grid;place-items:center;color:#fff;font-weight:700;font-size:14px}
@keyframes breath{0%,100%{transform:scale(.62)}50%{transform:scale(1)}}
.caps{min-height:150px}
.caps .ln{padding:8px 0;border-top:1px solid #273c51}
.caps .ln.new{animation:drop .4s ease}
.caps .ln:first-child{border-top:0}
.caps .yue{font-size:17px;font-weight:500;line-height:1.4}
.caps .en{font-size:13px;color:#a9bccc;margin-top:2px}
.nchip{font-size:12px;font-weight:600;padding:4px 9px;border-radius:999px;border:1.5px solid #3a5570;color:#e7eef5;background:transparent}
.nchip.on{background:#2b4a63}
.helpbtn{display:block;width:100%;border-radius:14px;padding:14px;font-weight:700;background:#24394d;color:#fff;border:1.5px dashed #4e6c88}

.chat{display:flex;flex-direction:column;gap:8px;padding:6px 14px 10px}
.msg{max-width:86%;padding:10px 12px;border-radius:16px;font-size:14px;line-height:1.4;word-break:break-word}
.msg.me{align-self:flex-end;background:var(--jade);color:#fff;border-bottom-right-radius:4px}
.msg.ai{align-self:flex-start;background:#f0f4f3;border-bottom-left-radius:4px}
.msg.human{align-self:flex-start;background:var(--sun-2);border:1px solid #f0dc95;border-bottom-left-radius:4px}
.msg.sys{align-self:center;font-size:12px;color:var(--muted);background:none;text-align:center;padding:2px 8px}
.src{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin-top:7px}
.conf{height:5px;width:60px;border-radius:9px;background:#dfe6e4;overflow:hidden;display:inline-block}
.conf i{display:block;height:100%}
.chatin{display:flex;gap:8px;padding:10px 14px;border-top:1px solid var(--line);position:sticky;bottom:0;background:#fff}
.chatin input{flex:1;min-width:0;border:1.5px solid var(--line);border-radius:999px;padding:10px 14px;font-size:14px}
.chatin button{background:var(--jade);color:#fff;border-radius:999px;padding:0 16px;font-weight:700}

.story{background:var(--jade-2);border-radius:18px;padding:20px;text-align:center;min-height:200px;display:flex;flex-direction:column;justify-content:center;gap:12px}
.story .em{font-size:64px;line-height:1}
.story p{font-size:16px;line-height:1.45}
.pano{height:130px;border-radius:14px;overflow:hidden;position:relative;background:linear-gradient(90deg,#cfe3dd,#e9f1ee 20%,#bcd6cf 35%,#f4efe2 50%,#cbdcd7 65%,#e7efe9 80%,#cfe3dd);background-size:200% 100%;animation:pan 14s linear infinite}
@keyframes pan{to{background-position:-200% 0}}
.pano .lbl{position:absolute;left:10px;bottom:10px;background:rgba(255,255,255,.92);font-size:12px;font-weight:700;padding:4px 8px;border-radius:8px}
.pano .gate{position:absolute;top:22px;left:40%;font-weight:800;font-size:28px;color:var(--jade)}
.snd{display:flex;align-items:center;gap:10px;padding:9px 0;border-top:1px solid var(--line);font-size:14px}
.snd:first-child{border-top:0}
.snd .bars{display:flex;gap:2px;align-items:flex-end;height:18px}
.snd .bars i{width:4px;background:var(--jade-3);border-radius:2px}
.snd .bars i.on{background:var(--jade)}
.snd button{margin-left:auto;background:var(--jade-2);color:var(--jade);font-weight:700;font-size:13px;padding:6px 12px;border-radius:999px}

.scan{position:absolute;inset:0;background:rgba(10,20,18,.92);z-index:30;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;color:#fff;font-weight:700}
.scan .frame{width:200px;height:200px;border:3px solid var(--sun);border-radius:20px;position:relative;overflow:hidden;background:#fff;display:grid;place-items:center}
.scan .beam{position:absolute;left:0;right:0;height:3px;background:var(--sun);box-shadow:0 0 16px var(--sun);animation:beam 1s ease-in-out infinite alternate}
@keyframes beam{from{top:6%}to{top:92%}}
.dots::after{content:"";animation:dots 1.2s steps(4) infinite}
@keyframes dots{0%{content:""}25%{content:"."}50%{content:".."}75%{content:"..."}}

.wide{max-width:1180px;margin:0 auto}
.tablet{background:#111;border-radius:34px;padding:16px;box-shadow:0 30px 60px -20px rgba(10,40,35,.35)}
.tablet .scr{background:#f6f8f7;border-radius:20px;min-height:600px;overflow:hidden}
.dhead{display:flex;align-items:center;gap:10px 14px;padding:16px 22px;background:#fff;border-bottom:1px solid var(--line);flex-wrap:wrap}
.dhead h2{font-size:20px;font-weight:800}
.grid{display:grid;gap:16px;padding:18px}
.grid>*{min-width:0}
.g2{grid-template-columns:1.4fr 1fr}
.panel{background:#fff;border:1px solid var(--line);border-radius:16px;padding:16px;min-width:0}
.panel h4{font-size:12px;font-weight:800;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);margin-bottom:12px}
.tscroll{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:13px}
th{text-align:left;font-size:11px;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.05em;padding:6px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:9px 8px;border-bottom:1px solid #edf1ef;vertical-align:middle}
tr.me td{background:var(--sun-2)}
.heat{display:grid;grid-template-columns:90px repeat(6,minmax(34px,1fr));gap:4px;font-size:11px;font-variant-numeric:tabular-nums;min-width:340px}
.heat .h{font-weight:700;color:var(--muted);display:flex;align-items:center}
.heat .c{height:30px;border-radius:6px;display:grid;place-items:center;font-weight:700}
.meter{height:8px;border-radius:9px;background:#e6ecea;overflow:hidden;margin-top:6px}
.meter i{display:block;height:100%;background:var(--jade)}
.alert{display:flex;gap:10px;align-items:flex-start;padding:10px;border-radius:12px;background:var(--red-2);margin-bottom:8px;font-size:13px}
.alert.amber{background:var(--amber-2)}
.alert.ok{background:var(--ok-2)}
.alert .ab{margin-left:auto;background:#fff;border:1px solid var(--line);border-radius:8px;padding:6px 10px;font-weight:700;font-size:12px;white-space:nowrap}
.brief{border:1px solid var(--line);border-radius:14px;padding:14px;background:#fff;margin-bottom:10px}
.brief.hl{border:2px solid var(--jade);box-shadow:0 0 0 4px var(--jade-2)}

/* guide */
.guide{max-width:900px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
.gsec{background:#fff;border:1px solid var(--line);border-radius:18px;padding:22px}
.gsec h2{font-size:21px;font-weight:800;letter-spacing:-.01em;margin-bottom:10px}
.gsec h3{font-size:15px;font-weight:700;margin:16px 0 6px}
.gsec p,.gsec li{font-size:14.5px;line-height:1.6;max-width:70ch}
.gsec ul,.gsec ol{padding-left:20px;display:flex;flex-direction:column;gap:5px}
.gsec .eyebrow{font-size:11px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--jade);margin-bottom:6px}
.gsec table td,.gsec table th{font-size:13px;vertical-align:top;line-height:1.45}
.notice{background:var(--sun-2);border:1px solid #f0dc95;border-radius:14px;padding:14px 16px;font-size:14px;line-height:1.5}
.aigrid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:8px}
.aigrid>div{border:1px solid #d3cff3;background:var(--violet-2);border-radius:14px;padding:14px;min-width:0}
.aigrid h4{font-size:14px;margin-bottom:6px;color:var(--violet)}
.aigrid p{font-size:13px;line-height:1.5}

@media (max-width:900px){.g2,.aigrid{grid-template-columns:1fr}.phone.big{transform:none;margin-bottom:0}}
@media (max-width:420px){.phone{width:100%;height:740px}.tabs{margin-left:0}}
@media (max-width:700px){.top{position:static}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<header class="top">
  <div class="topin">
    <div class="brand"><span class="logo" aria-hidden="true"></span>Smooth Journey <span class="tag">Student concept prototype · fictional data · not a Cathay Pacific product</span><span id="aist" class="aist off">AI: checking…</span></div>

function qr(seed,size){const n=25,c=size/n;let r="",x=seed;const rnd=()=>{x=(x*9301+49297)%233280;return x/233280;};
  const fd=(i,j)=>{for(const [a,b] of [[0,0],[0,n-7],[n-7,0]]){if(i>=a&&i<a+7&&j>=b&&j<b+7){const u=i-a,v=j-b;return (u==0||u==6||v==0||v==6||(u>=2&&u<=4&&v>=2&&v<=4))?1:0;}if(i>=a-1&&i<a+8&&j>=b-1&&j<b+8)return 0;}return -1;};
  for(let i=0;i<n;i++)for(let j=0;j<n;j++){const f=fd(i,j);const on=f===-1?rnd()>.52:f;if(on)r+=`<rect x="${(j*c).toFixed(2)}" y="${(i*c).toFixed(2)}" width="${c.toFixed(2)}" height="${c.toFixed(2)}"/>`;}

/* ---------- privacy: redaction before anything reaches the AI ---------- */
function redact(text){
  let t=String(text||"");const removed=[];
  const rules=[
    [/[A-Z0-9._%+-]+@[A-Z0-9.-]+\.[A-Z]{2,}/gi,"[email]","email address"],
    [/\b[A-Z]{1,2}\d{6}\s?\(?[0-9A]\)?/g,"[ID number]","ID number"],
    [/\b[A-Z]{1,2}\d{7,8}\b/g,"[document number]","passport or document number"],
    [/\+?\d[\d\s()-]{6,}\d/g,"[phone]","phone number",m=>(m.match(/\d/g)||[]).length>=8],
    [/\b(?:Mrs|Mr|Ms|Miss|Mdm|Madam|Dr)\.?\s+[A-Z][a-zA-Z'-]+(?:\s+[A-Z][a-zA-Z'-]+)*/g,"[name]","name"],
    [/\b(?:Chan Wai Ling|Wai Ling|Chan|Mei|Tom|Grace|Kelvin|Joyce|Daniel|Sam)\b/g,"[name]","name"],
    [/\(\s*\d{1,3}\s*\)|\baged?\s+\d{1,3}\b|\b\d{1,3}\s*(?:years?[\s-]old|y\/o|yo)\b/gi,"[age]","age"],
    [/\b\d{1,2}\s*(?:歲|岁)/g,"[age]","age"]
  ];
  for(const [re,rep,label,test] of rules){
    t=t.replace(re,m=>{if(test&&!test(m))return m;removed.push(label);return rep;});
  }
  const dx=[];t=scrubDx(t,dx);if(dx.length)removed.push("condition names");
  return {text:t, removed:uniq(removed), dx:uniq(dx)};
}
function scrubDx(s,found){
  let out=String(s||"");
  for(const w of DX){const re=new RegExp("\\b"+w.replace(/ /g,"\\s+")+"\\w*","gi");out=out.replace(re,m=>{if(found)found.push(m.toLowerCase());return "[condition]";});}
  return out;
}
function markRedactions(s){return esc(s).replace(/\[(name|age|phone|email|ID number|document number|condition)\]/g,'<mark>$1</mark>');}
/* Drop whole sentences that named a condition, so nothing like "Has [condition]." is kept. */
function dropDx(s,found){
  const scrubbed=scrubDx(s,found);
  return scrubbed.split(/(?<=[.!?;])\s+/).filter(x=>!/\[condition\]/.test(x)).join(" ").trim();
}

async function connectAI(){

}
function aiOn(){return AI_STATE==="live"&&!!AI_MODE&&S.consent.ai;}
/* Hosted mode: the server builds the prompts, so the browser can only ask for these three fixed jobs. */
async function apiCall(task,payload,signal){
  let res;
  try{res=await fetch("/api/ai",{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify(Object.assign({task},payload)),signal});}
  catch(e){throw {code:e&&e.name==="AbortError"?"cancelled":"upstream_error"};}
  if(res.status===429)throw {code:"rate_limited"};
  if(res.status===503)throw {code:"ai_disabled"};
  if(!res.ok)throw {code:"upstream_error"};
  const d=await res.json().catch(()=>null);
  if(!d||!("result" in d))throw {code:"upstream_error"};
  return d.result;
}
async function loadFlights(){
  if(FLIGHTS_STATE!=="idle")return;
  FLIGHTS_STATE="loading";
  try{const r=await fetch("/api/flights",{cache:"no-store"});const d=r.ok?await r.json():null;
    if(d&&Array.isArray(d.hourly)&&d.total>0){FLIGHTS=d;FLIGHTS_STATE="ok";}else FLIGHTS_STATE="none";}
  catch(e){FLIGHTS_STATE="none";}
  render();
}
const HARD_OFF=["not_granted","sampling_disabled","not_declared","capability_disabled","capability_removed","ai_disabled"];
function aiFail(e){
  const code=e&&e.code;
  if(HARD_OFF.includes(code)){AI_STATE="off";return "AI isn't available in this view, so the built-in rules were used instead.";}
  if(code==="rate_limited")return "Too many AI requests right now, so the built-in rules were used. You can try AI again in a minute.";
  if(code==="session_expired")return "Your Claude sign-in has expired, so the built-in rules were used.";
  if(code==="cancelled")return "You stopped the AI, so the built-in rules were used.";
  return "The AI's answer couldn't be used, so the built-in rules were used instead.";
}
async function aiJSON(prompt,signal,cache){
  if(!aiOn()||!SAMPLE)throw {code:"ai_off"};
  const o={modelTier:"quick",cache:cache===undefined?true:cache};if(signal)o.signal=signal;
  return SAMPLE.json(prompt,o);
}
async function aiText(prompt,signal){
  if(!aiOn()||!SAMPLE)throw {code:"ai_off"};

}

/* ---------- AI element 1: Access Passport coding ---------- */
function passportPrompt(redacted){
  return `You are helping an airline's special assistance team. Turn a passenger's own description of their travel needs into IATA special service request (SSR) codes. A trained staff member checks your suggestion before anything is used.

Rules:
1. Use only these codes, with these meanings:
${Object.entries(ALLOWED).map(([c,m])=>"- "+c+": "+m).join("\n")}
2. Never invent a code. For a need with no specific code, use OTHS and describe the need in a short phrase.
3. Use at most one of WCHR, WCHS and WCHC: the one that fits best. Only use a battery code (WCBD, WCBW, WCLB) if the battery type is stated.
4. Record functional needs only: what help is needed. Never write a medical diagnosis or condition name. If the text names one, leave it out and list the word in "removed_diagnoses".
5. Text in square brackets, like [name] or [age], was removed for privacy. Ignore it.
6. "medif" is true only if the text mentions oxygen, recent surgery or a hospital stay, a stretcher, an infectious illness, or medical equipment needed on board. Otherwise false.
7. "evacuation_help" is true if the passenger cannot manage stairs, cannot walk, or could not move through the cabin quickly without help.
8. "safety_assistant" is true only if the passenger could not unfasten their seatbelt, put on an oxygen mask or life jacket, or understand the safety briefing, even with crew help.
9. If something important is unclear (for example the battery type, or whether they can walk in the cabin), add a short question for staff.
10. Write every field in plain English, even if the passenger wrote in Chinese.

Passenger's description:
"""
${redacted.replace(/"""/g,'"')}
"""

Reply with only this JSON, no other text:
{"codes":[{"code":"WCHS","need":"short phrase"}],"plain_summary":"one or two sentences of functional needs, with no names and no diagnoses","medif":false,"medif_reason":"","evacuation_help":false,"safety_assistant":false,"removed_diagnoses":[],"questions_for_staff":[]}`;
}
function cleanPassport(r){
  if(!r||typeof r!=="object"||!Array.isArray(r.codes))throw {code:"invalid_shape"};
  const out=[],seen=new Set(),dx=[];let mob=null;
  for(const c of r.codes.slice(0,12)){
    const code=String(c&&c.code||"").toUpperCase().trim();
    if(!ALLOWED[code])continue;                         // whitelist: invented codes are dropped
    if(MOBILITY.includes(code)){if(mob)continue;mob=code;}
    let need=String(c&&c.need||ALLOWED[code]).replace(/\s+/g," ").trim().slice(0,160);
    need=dropDx(need,dx)||ALLOWED[code];
    const key=code==="OTHS"?code+need.toLowerCase():code;
    if(seen.has(key))continue;seen.add(key);
    out.push({code,desc:need||ALLOWED[code]});
  }
  if(!out.length)throw {code:"invalid_shape"};
  const codes=out.map(c=>c.code);
  const removedDx=uniq([...(Array.isArray(r.removed_diagnoses)?r.removed_diagnoses.map(x=>String(x).toLowerCase().slice(0,40)):[]),...dx]);
  return {
    codes:out,
    summary:dropDx(String(r.plain_summary||"").slice(0,400),removedDx),
    medif:!!r.medif||codes.some(c=>MEDIF_CODES.includes(c)),
    medifWhy:scrubDx(String(r.medif_reason||"").slice(0,200)),
    evac:!!r.evacuation_help||codes.some(c=>EVAC_CODES.includes(c)),
    safetyAsst:!!r.safety_assistant,
    removedDx:uniq(removedDx),
    questions:(Array.isArray(r.questions_for_staff)?r.questions_for_staff:[]).slice(0,3).map(q=>scrubDx(String(q).slice(0,160)))
  };
}
/* Built-in rules: used when AI is off, unavailable or declined. English only. */
function rulesPassport(text){
  const t=String(text||"").toLowerCase().replace(/[\u2018\u2019]/g,"'");const c=[];
  const noStairs=/(can'?t|cannot|can not|unable to|not able to|no)\s+(manage|climb|do|use|walk up)?\s*(the\s+)?stairs|stairs?\s+(are|is)\s+(hard|difficult|impossible)/.test(t);
  if(/(can'?t|cannot|unable to|not able to)\s+walk\b|immobile|bed-?bound/.test(t))c.push({code:"WCHC",desc:"Cannot walk. Needs help all the way to and from the seat."});
  else if(noStairs)c.push({code:"WCHS",desc:"Cannot manage stairs. Can walk short distances, including to the seat."});
  else if(/long distance|walk far|far distances|tired walking/.test(t))c.push({code:"WCHR",desc:"Needs a wheelchair for long distances. Can manage stairs."});
  if(/lithium/.test(t))c.push({code:"WCLB",desc:"Own wheelchair with a lithium-ion battery."});
  else if(/powered|electric wheelchair|power ?chair|mobility scooter/.test(t))c.push({code:"OTHS",desc:"Powered mobility aid. Battery type to be confirmed (WCBD, WCBW or WCLB)."});
  else if(/folding wheelchair|own wheelchair|manual wheelchair|her wheelchair|his wheelchair|their wheelchair/.test(t))c.push({code:"WCMP",desc:"Own folding wheelchair. Carried free and returned at the aircraft door."});
  if(/hard of hearing|deaf|hearing/.test(t))c.push({code:"DEAF",desc:"Hard of hearing in noisy places. Prefers written communication."});
  if(/blind|low vision|sight/.test(t))c.push({code:"BLND",desc:"Blind or low vision."});
  if(/anxious|crowd|nervous|panic/.test(t))c.push({code:"OTHS",desc:"Anxious in crowds. A quiet waiting area and a written heads-up before changes help."});
  if(/oxygen/.test(t))c.push({code:"OXYG",desc:"Needs oxygen on board."});
  if(/surgery|operation|hospital/.test(t))c.push({code:"MEDA",desc:"Recent surgery or hospital stay. Medical clearance needed."});
  if(/alone|by herself|by himself|on (her|his|their) own|drop (her|him|them) off/.test(t))c.push({code:"MAAS",desc:"Travelling alone. Meet before the carer leaves and stay with the passenger at each step."});
  if(!c.length)c.push({code:"OTHS",desc:"Needs not recognised automatically. Staff to review with the passenger."});
  const codes=c.map(x=>x.code);const dx=[];scrubDx(text,dx);
  return {codes:c, summary:c.map(x=>x.desc).join(" "), medif:codes.some(x=>MEDIF_CODES.includes(x)), medifWhy:codes.some(x=>MEDIF_CODES.includes(x))?"Oxygen, surgery or a hospital stay was mentioned.":"",
    evac:codes.some(x=>EVAC_CODES.includes(x)), safetyAsst:false, removedDx:uniq(dx), questions:/powered|electric|power ?chair|scooter/.test(t)&&!/lithium/.test(t)?["What type of battery does the mobility aid use?"]:[]};
}

const BRIEF_LINES = {

  WCMP:"Own folding wheelchair in the hold, to be returned at the aircraft door on arrival.",

${S.pass.codes.map(c=>"- "+c.desc).join("\n")}

function cleanBrief(t){

  s=dropDx(s).slice(0,700);
  if(!s)throw {code:"empty"};
  s=s.split(/(?<=[.!?])\s+/).filter(x=>!/evacuat/i.test(x)).join(" ").trim();
  if(S.pass.evac)s=(s.replace(/\.?$/,".")+" "+EVAC_LINE).trim();      // safety line is always present
  return s;
}

function conciergePrompt(q){
  const ctx=S.chat.filter(m=>m.from==="me"||m.from==="ai").slice(-4).map(m=>(m.from==="me"?"Passenger: ":"Assistant: ")+redact(m.text).text).join("\n");
  return `You answer questions in an airline's accessibility assistant. Answer ONLY from the policy excerpts below, never from general knowledge. If the excerpts do not clearly answer the question, say you'll pass it to a person and set needs_human to true. At most 60 words. Plain, warm language. Answer in the same language as the question.

Policy excerpts:
${POLICY.map(p=>"["+p.id+"] "+p.title+": "+p.text).join("\n")}

${ctx?"Recent conversation:\n"+ctx+"\n\n":""}Question: """${q.replace(/"""/g,'"')}"""

Reply with only this JSON: {"answer":"...","source":"P1","confidence":0,"needs_human":false}
"source" is the one excerpt id you relied on, or null. "confidence" is 0 to 100: how fully the excerpt answers the question.`;
}
function offlineAnswer(q){
  const t=q.toLowerCase();
  const m=[[/weigh|size|dimension|heavy|fit/,"P5",58],[/folding|own wheelchair|bring.*wheelchair|wheelchair.*bring|mobility aid/,"P1",92],[/quiet|calm|noise|noisy|crowd/,"P7",88],[/seat|exit row|aisle|lavatory|toilet/,"P4",86],
    [/notice|when.*(ask|book|request)|48|deadline/,"P3",90],[/hear|deaf|caption|write/,"P6",88],[/alone|by myself|on my own/,"P9",88],[/safety assistant|companion|escort.*fly/,"P8",85]];
  for(const [re,id,conf] of m)if(re.test(t)){const p=POLICY.find(x=>x.id===id);return {answer:p.text,source:id,confidence:conf,needs_human:conf<80};}
  return {answer:"I can't answer that from the policies I have, so I'll pass it to a person.",source:null,confidence:30,needs_human:true};
}

/* ---------- audio (sound ladder) ---------- */
let AC;
function playLevel(i){
  try{AC=AC||new (window.AudioContext||window.webkitAudioContext)();}catch(e){return;}
  const now=AC.currentTime;
  if(i===1){[880,660].forEach((f,k)=>{const o=AC.createOscillator(),g=AC.createGain();o.type="sine";o.frequency.value=f;const t=now+k*.6;g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(.18,t+.02);g.gain.exponentialRampToValueAtTime(.001,t+1.2);o.connect(g).connect(AC.destination);o.start(t);o.stop(t+1.3);});return;}
  const len=AC.sampleRate*3,buf=AC.createBuffer(1,len,AC.sampleRate),d=buf.getChannelData(0);let last=0;
  for(let j=0;j<len;j++){const w=Math.random()*2-1;last=(last+.02*w)/1.02;d[j]=last*3.5;}
  const src=AC.createBufferSource();src.buffer=buf;const lp=AC.createBiquadFilter();lp.type="lowpass";lp.frequency.value=[400,0,900,1600,3200][i];
  const g=AC.createGain();const v=[.15,0,.35,.55,.8][i];g.gain.setValueAtTime(0,now);g.gain.linearRampToValueAtTime(v,now+.5);g.gain.setValueAtTime(v,now+2.4);g.gain.linearRampToValueAtTime(0,now+3);
  src.connect(lp).connect(g).connect(AC.destination);src.start();}

function pRecover(){

  if(S.rec===1) return head+`<div class="card"><h3>1 · Evidence</h3>
  ${S.photo?`<div style="height:150px;border-radius:12px;background:linear-gradient(135deg,#d9dfdd,#b8c2bf);display:grid;place-items:center;font-size:54px;position:relative" aria-label="Photo of damaged wheelchair (demo)">♿<span class="pill red" style="position:absolute;bottom:8px;left:8px">Bent footrest</span></div>`:`<button class="btn sec" data-act="photo">📷 Take a photo</button>`}
  <ul class="list mt"><li><span class="chk ok">✓</span>Flight CX 255 · 13 Nov</li><li><span class="chk ok">✓</span>Time 06:31 · added automatically</li><li><span class="chk ok">✓</span>Stage: Baggage & meet family</li><li><span class="chk ok">✓</span>Responsible team: Heathrow assistance, shift T3-B</li></ul>
  <p class="small mt">Reports name the team, not individual staff.</p></div>

  <div class="pad"><button class="btn sun" data-act="recNext">Accept</button><button class="btn ghost mt" data-act="recNext">No thanks</button></div>`;

  <ul class="list mt"><li><b style="width:90px;flex:0 0 90px">Type</b>Damaged mobility aid</li><li><b style="width:90px;flex:0 0 90px">Item</b>Own folding wheelchair</li><li><b style="width:90px;flex:0 0 90px">Damage</b>Bent footrest</li><li><b style="width:90px;flex:0 0 90px">Evidence</b>1 photo · flight, time, stage</li><li><b style="width:90px;flex:0 0 90px">Uses</b>Only the details above. Nothing else from your Passport.</li><li><b style="width:90px;flex:0 0 90px">Goes to</b><span class="pill amber">Claims specialist (a person)</span></li></ul></div>
  <div class="pad"><button class="btn" data-act="recNext">Submit claim</button></div>`;
  return head+`<div class="card soft"><h3>Submitted ✓ · Ref SJ-24817</h3><p>A claims specialist has your evidence and will contact you within 2 working days.</p><p class="small mt">No airport forms and no emailing receipts.${carerOn()?" Mei has been told.":""}</p></div>
  <div class="pad"><button class="btn sec" data-act="go" data-arg="journey">Done</button></div>`;}

function pReflect(){
  const q=[["air","At the airport"],["board","On board"],["arr","At arrival"]];const em=[["😟","Worried"],["😐","Okay"],["🙂","Good"],["😊","Great"]];

  ${all?`<div class="card soft"><h3>Your confidence timeline</h3><div class="row mt" style="align-items:flex-end;gap:14px;height:70px">${[[38,"Mar"],[55,"Jul"],[80,"Nov"]].map(([h,m])=>`<div style="text-align:center;flex:1"><div style="height:${Math.round(h*.7)}px;background:var(--jade);border-radius:6px 6px 0 0"></div><div class="small">${m}</div></div>`).join("")}</div>

  <p class="small pad">${S.consent.analytics?"Anonymous totals (no names) help find stations and steps that cause stress or delays. Turn this off in Privacy.":"Anonymous feedback is off. Your answers stay on this phone."}</p>`;}

function pAsk(){
  const sug=["Can I bring my folding wheelchair?","What's the wheelchair weight limit?","Can I bring my power-chair battery?","Where can I wait somewhere quiet?"];
  const msgs=S.chat.map(m=>{
    if(m.from==="me")return `<div class="msg me">${esc(m.text)}</div>`;
    if(m.from==="sys")return `<div class="msg sys">${esc(m.text)}</div>`;
    if(m.from==="human")return `<div class="msg human"><b>Wing · Accessibility team</b><br>${esc(m.text)}</div>`;
    const col=m.conf>=80?"var(--ok)":m.conf>=60?"var(--amber)":"var(--red)";
    const pol=m.src?POLICY.find(p=>p.id===m.src):null;
    return `<div class="msg ai">${esc(m.text)}<div class="src">${m.live?`<span class="pill ai">✦ AI</span>`:`<span class="pill grey">Offline answer</span>`}${pol?`<span class="pill grey">📄 ${esc(pol.id)} · ${esc(pol.title)}</span>`:""}${m.conf!=null?`<span class="small">confidence ${m.conf}%</span><span class="conf" aria-hidden="true"><i style="width:${m.conf}%;background:${col}"></i></span>`:""}</div></div>`;}).join("");
  return `<div style="display:flex;flex-direction:column;min-height:100%"><div class="hdr"><h1>Ask</h1><p>Answers come only from the airline's own policies.</p></div>
  <div class="chat" style="flex:1" aria-live="polite">${S.chat.length?"":`<div class="msg ai">Hello Mrs Chan. Ask me anything about your trip, in English, 廣東話 or 普通話. Safety, medical and battery questions always go to a person.<div class="src">${aiOn()?`<span class="pill ai">✦ AI live</span>`:`<span class="pill grey">Offline answers</span>`}</div></div>`}${msgs}${S.typing?`<div class="msg ai dots">Thinking</div>`:""}</div>
  ${S.chat.length<2?`<div class="pad" style="padding-top:0"><div class="chips">${sug.map(s=>`<button class="chip" data-act="ask" data-arg="${esc(s)}">${s}</button>`).join("")}</div></div>`:""}
  <p class="small" style="padding:0 16px 6px">Names and numbers are removed before your question reaches the AI.</p>
  <div class="chatin"><input id="askin" aria-label="Your question" placeholder="Type your question…" autocomplete="off"><button data-act="askInput" ${S.typing?"disabled":""}>Send</button></div></div>`;}

  <div class="card"><h3>Who looked at my data</h3>${S.accessLog.length?`<ul class="list">${S.accessLog.slice(0,8).map(a=>`<li><span class="small" style="flex:0 0 74px">${esc(a.t.replace(/^\w{3} /,""))}</span><span><b style="font-size:13px">${esc(a.who)}</b><br><span class="small">${esc(a.what)}</span></span></li>`).join("")}</ul>`:`<p class="small">Nobody yet. Every view and scan by staff shows up here.</p>`}</div>

  <div class="pad" style="padding-top:0"><button class="btn sec sm" data-act="panel" data-arg="export">See all my data</button><button class="btn ghost sm mt" data-act="panel" data-arg="confirmDelete" ${S.pass.status==="none"?"disabled":""}>Delete my Access Passport</button></div>`;}

function passengerBody(){
  switch(S.p){

  let status,sub;
  if(S.phase==="setup"){status=S.brief.status==="approved"?"Plan confirmed for 12 Nov":S.plan?"Plan confirmed · brief awaiting Mum's OK":S.booked?"Booked · plan arrives 10 Nov":"Setting up Mum's trip";sub="CX 255 · HKG → LHR";}
  else if(S.done===0){status="Waiting for check-in";sub="Mum's at HKIA T1 with you";}
  else if(S.done>=6){status="Journey complete ✓";sub="Mum is with Tom in London";}
  else {const s=STAGES[S.done-1];status=s.name+" ✓";sub="With "+STAGES[S.done].owner+" · next: "+STAGES[S.done].name;}
  const prog=STAGES.map((s,i)=>`<span style="flex:1;height:6px;border-radius:9px;background:${i<S.done?"var(--ok)":i===S.done&&S.phase!=="setup"?"var(--sun)":"var(--line)"}"></span>`).join("");
  return head+`<div class="pad" style="padding-top:0"><span class="pill ok">✓ Mum agreed to be followed · ends on arrival</span></div>
  ${S.delay?`<div class="card warn"><h3>${S.delay==="pending"?"CX 255 delayed 55 min":"New plan approved ✓"}</h3><p class="small">${S.delay==="pending"?"Mum's assistance is being moved to the new time and aircraft.":"All of Mum's assistance moved with her flight."}</p></div>`:""}
  <div class="card jade"><h3 style="font-size:20px">${status}</h3><p class="small">${sub}</p><div class="row mt" style="gap:4px">${prog}</div></div>
  ${S.done>=6?`<div class="card soft"><p class="small">🔒 Sharing has ended now that Mum has arrived.</p></div>`:""}
  <div class="card"><h3>Updates</h3>${S.carerLog.length?`<ul class="list">${S.carerLog.map(l=>`<li><span class="small" style="width:44px;flex:0 0 44px">${esc(l.t)}</span><span>${esc(l.msg)}</span></li>`).join("")}</ul>`:`<p class="small">Updates appear here as staff scan Mum's card.</p>`}</div>
  <div class="pad"><p class="small">Updates come from staff scans, not Mum's phone, so this works even if her phone is off. You see where she is, not her medical or service details.</p>
  <div class="row mt"><button class="btn sec sm" style="flex:1" data-act="demoOnly">📞 Call Mum</button><button class="btn ghost sm" style="flex:1" data-act="demoOnly">Call assistance</button></div>
  <p class="small mt">Also by SMS to: Mei · +852 9xxx 4417</p></div>`;}

    <ul class="list mt">${S.pass.codes.map((c,i)=>`<li><span class="code">${c.code}</span><span style="font-size:13px;flex:1">${esc(c.desc)}</span><button class="small" style="color:var(--red);font-weight:700" data-act="removeCode" data-arg="${i}" aria-label="Remove ${c.code}">✕</button></li>`).join("")}</ul>

    <div class="card"><h3>Upcoming · Thu 12 Nov</h3><p class="small">${S.plan?"6 staff assigned to Mrs Chan's journey. Each sees only their own step.":"Plans are confirmed 48 hours before departure."}</p></div>
    <p class="small pad">Staff see needs and codes, never diagnoses. Every view is recorded in the passenger's access log.</p>`;}

  return `<div class="hdr"><p>Staff app · ${s.date} · ${s.where.split(" · ")[0]}</p><h1>${s.owner}</h1><p>${s.role}</p></div>
  ${S.helpReq&&!S.helpAck?`<div class="card bad"><h3>⚠ Mrs Chan is asking where her help is</h3><p class="small">She pressed "I'm here" · ${s.where}</p><button class="btn red sm mt" data-act="ack">On my way</button></div>`:""}
  ${S.delay==="approved"?`<div class="card soft"><p class="small">CX 255 now departs 00:45. Your step moved automatically.</p></div>`:""}
  <div class="card" style="border:2px solid var(--jade)"><div class="row between"><h3>Mrs CHAN Wai Ling</h3><span class="pill amber">Your step</span></div>
  <p class="small">CX 255 · 41C · ${s.name}</p>
  <div class="codes mt">${S.pass.deleted?`<span class="small">No Access Passport on file</span>`:codesOf().map(c=>`<span class="code">${c}</span>`).join("")}</div>

  <div class="mt" style="background:#f6f8f7;border-radius:12px;padding:10px;font-size:13px">
  <div class="row between"><span class="small">From</span><b>${prev?prev.owner+" · "+prev.role:"Mei (daughter) at drop-off"}</b></div>

  <div class="row between mt"><span class="small">To</span><b>${next?next.owner+" · "+next.name:"Tom (grandson)"}</b></div></div>
  ${S.done===0?`<p class="small mt">🌻 Meet her before Mei leaves. Offer a Sunflower lanyard.</p>`:""}
  <button class="btn mt2" data-act="scan">▣ Scan card · Complete handover</button>

  return `<div class="wide"><div class="tablet"><div class="scr">
  <div class="dhead"><h2>CX 255 · HKG → LHR</h2><span class="pill grey">A350-1000 · 12 Nov · 23:50</span><span class="pill" style="margin-left:auto">Pre-flight briefing · Assistance</span></div>

    <div class="brief hl"><div class="row between" style="flex-wrap:wrap;gap:8px"><div class="row"><span class="code">41C</span><b style="font-size:16px">Mrs CHAN Wai Ling</b></div>${pill}</div>
     <div class="codes mt">${S.pass.deleted?"":codesOf().map(c=>`<span class="code" style="background:var(--jade)">${c}</span>`).join("")}</div>${body}</div>
    <div class="brief"><div class="row between"><div class="row"><span class="code">33D</span><b>Ms OKAFOR A.</b></div><span class="pill ok">✓ Approved</span></div><p class="mt" style="font-size:14px">Blind. Prefers verbal guidance and to take your arm. Describe the meal tray layout clockwise.</p></div>
    <div class="brief"><div class="row between"><div class="row"><span class="code">58H</span><b>Mr NG T.</b></div><span class="pill ok">✓ Approved</span></div><p class="mt" style="font-size:14px">Cannot walk. Aisle chair for boarding and the lavatory. Will need help in an evacuation.</p></div>
   </div>
   <div>
    <div class="panel"><h4>Cabin summary</h4><ul class="list"><li>3 passengers with assistance</li><li>1 own wheelchair in hold (return at the door, LHR)</li><li>Arrival: Heathrow assistance team meets 2 at door L2</li></ul></div>

/* ---------- GUIDE ---------- */
function guideView(){
  return `<div class="guide">
  <div class="notice"><b>Student concept prototype.</b> Smooth Journey is a design concept for a Cathay Pacific accessibility challenge. It is not a Cathay Pacific product and is not endorsed by Cathay Pacific. All people, bookings, times and policy text are fictional or illustrative.</div>

  <section class="gsec"><div class="eyebrow">What it is</div><h2>One optional layer that plans, tracks and confirms assistance</h2>
  <p>Smooth Journey follows a passenger who needs assistance from booking to arrival. The demo follows Mrs Chan, 78, flying alone from Hong Kong to London. She can't manage stairs, is hard of hearing in noise and gets anxious in crowds. Her daughter Mei follows from home. Six staff hand her on from check-in to the arrivals hall.</p>
  <h3>The five screens</h3>
  <ul>
    <li><b>Passenger app (Mrs Chan).</b> Access Passport, booking, confirmed plan and crew brief, "Get ready" (picture story, 360° preview, sound ladder), Live Assist with the "Where's my help?" button, In-Flight Coach (captions, breathing, discreet help), arrival, service recovery, reflection, Ask, and Privacy.</li>
    <li><b>Carer Mode (Mei).</b> Live progress from staff card scans, so it works even if Mrs Chan's phone is off. Mei sees where her mum is, not her service details. It ends automatically on arrival.</li>
    <li><b>Staff app.</b> Passport checks at the Special Assistance desk, then each staff member's own step: codes, short notes, who hands over to them and to whom they hand over. One scan completes a handover.</li>
    <li><b>Crew tablet.</b> The brief each passenger approved word for word, inside the normal pre-flight briefing, plus discreet help requests.</li>
    <li><b>Ground dashboard.</b> Demand heatmap, live handovers, overdue alerts, equipment, disruption approval. Read-only for supervisors.</li>
  </ul></section>

  <section class="gsec"><div class="eyebrow">AI</div><h2>Where AI is used, and how it's kept safe</h2>
  <p>${AI_MODE==="api"?"The AI is real. It runs on Amazon Nova through Amazon Bedrock in the team's own AWS account. The browser can only ask for these three fixed jobs, and the server writes the instructions. Amazon Bedrock doesn't store prompts or use them for training, and our server logs never record what anyone types.":"The AI is real. It runs on Claude through the viewer's Claude account when the page is opened in Claude, and the first time, Claude asks the viewer to allow it."} If AI is unavailable, or the passenger turns it off, built-in rules take over and every screen still works. The pill in the top bar shows which mode is on.</p>
  <div class="aigrid">
   <div><h4>✦ 1 · Access Passport</h4><p>Turns plain words, in English or Chinese, into IATA service codes, flags medical clearance and evacuation help, and lists questions for staff.</p><p class="mt"><b>Guardrails:</b> personal details are removed first. Only standard codes are accepted and anything invented is dropped. Diagnoses are stripped. Mobility and evacuation flags are double-checked by fixed rules. A staff member confirms before use.</p></div>
   <div><h4>✦ 2 · Crew brief</h4><p>Drafts a short note for crew from the checked needs only.</p><p class="mt"><b>Guardrails:</b> no names, ages or diagnoses. The evacuation line is added by fixed rules, never left to the AI. The passenger edits and approves the exact words before crew see them.</p></div>
   <div><h4>✦ 3 · Ask (concierge)</h4><p>Answers questions from the airline's policy text only, citing the section and a confidence score.</p><p class="mt"><b>Guardrails:</b> safety, medical and battery questions go straight to a person and never reach the AI. Answers below 80% confidence, or with no valid source, are handed to a person too.</p></div>
  </div>
  <h3>Where AI is deliberately not used</h3>
  <ul><li>Confirming handovers: staff scans only.</li><li>Approving a disruption re-plan: a duty manager decides. The re-plan in this demo is scripted.</li><li>Goodwill gestures: fixed by how serious the problem was, the same for everyone.</li><li>Deciding claims: a claims specialist (a person).</li></ul></section>

  <section class="gsec"><div class="eyebrow">Privacy</div><h2>Data protection built into every screen</h2>
  <ul>
    <li><b>Consent first.</b> Before anything is shared, the passenger sees exactly what will be sent and ticks an explicit consent. Accessibility needs can count as health information, so all of it is treated as sensitive.</li>
    <li><b>Redaction before AI.</b> Names, ages, phone numbers, email addresses and ID numbers are removed on the device. You see the redacted text before it's sent.</li>
    <li><b>Needs, not diagnoses.</b> Condition names are stripped from everything stored. The original words are deleted once staff confirm the codes.</li>
    <li><b>Need to know.</b> Each staff member sees only their own step. Mei sees progress, not details. Supervisors see status, not service details. Crew see only the approved brief.</li>
    <li><b>Passenger control.</b> Five switches: Carer Mode, crew brief, partner sharing, anonymous feedback and AI. Each one changes what the other screens show straight away. Safety information always reaches crew.</li>
    <li><b>Transparency.</b> "Who can see what" in plain words, and an access log of every staff view and scan.</li>
    <li><b>Access, portability and deletion.</b> "See all my data" shows everything held. "Delete" removes the Passport and the brief at once.</li>
    <li><b>Limited retention.</b> Journey tracking and staff locations are deleted 30 days after arrival. Staff location is shared only while on duty for that passenger. Service reports name teams, not individuals.</li>
    <li><b>This demo stores nothing.</b> Everything lives in this browser tab and disappears when you close or reload it.</li>
  </ul>
  <h3>How it lines up with the law</h3>
  <div class="tscroll"><table>
   <tr><th>Rule</th><th>What it asks</th><th>In the app</th></tr>
   <tr><td>PDPO DPP1</td><td>Collect only what's necessary, fairly, and say why</td><td>Needs only, purpose stated on the consent screen, redaction</td></tr>
   <tr><td>PDPO DPP2</td><td>Keep data accurate and no longer than needed</td><td>Staff check codes; yearly review; 30-day journey deletion</td></tr>
   <tr><td>PDPO DPP3</td><td>Use data only for the original purpose unless the person agrees</td><td>Sharing switches; anonymous feedback is opt-in</td></tr>
   <tr><td>PDPO DPP4</td><td>Protect data from unauthorised access</td><td>Role-based views; access log; location only on duty</td></tr>
   <tr><td>PDPO DPP5</td><td>Be open about policies and practices</td><td>"Who can see what" screen</td></tr>
   <tr><td>PDPO DPP6</td><td>Right to access and correct</td><td>"See all my data"; "Change my needs"</td></tr>
   <tr><td>GDPR / UK GDPR Art. 9</td><td>Explicit consent for health data</td><td>Consent tick box before any processing</td></tr>
   <tr><td>GDPR Art. 5, 25</td><td>Data minimisation; privacy by design</td><td>Redaction, no diagnoses, need-to-know views</td></tr>
   <tr><td>GDPR Art. 15, 17, 20</td><td>Access, erasure, portability</td><td>See all my data; Delete; export</td></tr>
   <tr><td>GDPR Art. 22</td><td>Human involvement in automated decisions</td><td>Staff confirm codes; passenger approves brief; people approve re-plans and claims</td></tr>
  </table></div>
  <p class="small mt">The London route falls under UK GDPR as well as Hong Kong's PDPO. This is a design concept, not legal advice. Before launch, Cathay's privacy team would need to review it, sign a no-retention data agreement with the AI provider, put safeguards in place for cross-border transfers, and run a privacy impact assessment.</p></section>

  <section class="gsec"><div class="eyebrow">Demo script</div><h2>A 3-minute walkthrough</h2>
  <ol>
   <li><b>Before the trip.</b> Passport → Create → read the redacted text → tick consent → "Suggest codes with AI". Staff phone: remove a code if wrong, then Confirm. Book CX 255. Plan → skip to 48 h → the AI drafts the crew brief → edit and Approve.</li>
   <li><b>Privacy.</b> Open the Privacy tab: turn Carer Mode off and watch Mei's phone pause, then turn it back on. Show "Who looked at my data".</li>
   <li><b>Day of travel.</b> Scan cards on the staff phone. Mei's updates arrive. Press "Where's my help?" and answer it as staff.</li>
   <li><b>Disruption.</b> Simulate a delay, open the dashboard, and approve the plan.</li>
   <li><b>On board.</b> Captions, breathing, the discreet help button, then the crew tablet.</li>
   <li><b>Arrival.</b> Final handover, "Something went wrong", reflection.</li>
   <li><b>Ask.</b> Folding wheelchair (AI, cited) → battery (sent to a person) → weight limit (low confidence, sent to a person).</li>
  </ol></section>
  </div>`;}

/* ---------- render ---------- */
function render(){
  const scr={};document.querySelectorAll("[data-scroll]").forEach(el=>scr[el.dataset.scroll]=el.scrollTop);
  const keep={};["askin","ptext","briefEdit"].forEach(id=>{const el=document.getElementById(id);if(el)keep[id]={v:el.value,f:document.activeElement===el,s:el.selectionStart};});
  const views=[["stage","All three phones"],["passenger","Passenger"],["carer","Carer (Mei)"],["staff","Staff"],["crew","Crew tablet"],["dash","Ground dashboard"],["guide","How it works"]];
  $("#tabs").innerHTML=views.map(([k,l])=>`<button class="${S.view===k?"on":""}" data-act="view" data-arg="${k}" aria-pressed="${S.view===k}">${l}</button>`).join("");
  const ai=$("#aist");ai.className="aist "+(aiOn()?"live":"off");
  ai.textContent=AI_STATE==="checking"?"AI: checking…":aiOn()?(AI_MODE==="api"?"✦ AI live · Amazon Bedrock":"✦ AI live"):(AI_STATE==="live"?"AI off (privacy setting)":"AI offline · built-in rules");
  const P=()=>phone("passenger","Mrs Chan · passenger",passengerBody(),pTabs());
  const C=()=>phone("carer","Mei · Carer Mode (Hong Kong)",carerBody());
  const T=()=>phone("staff","Ground staff app",staffBody(),"",scanOverlay());
  let h="";
  if(S.view==="stage")h=`<div class="stage">${P()}${C()}${T()}</div>`;
  else if(S.view==="passenger")h=`<div class="stage">${P()}</div>`;
  else if(S.view==="carer")h=`<div class="stage">${C()}</div>`;
  else if(S.view==="staff")h=`<div class="stage">${T()}</div>`;
  else if(S.view==="crew")h=crewView();
  else if(S.view==="dash")h=dashView();
  else h=guideView();
  $("#main").innerHTML=h;
  document.querySelectorAll("[data-scroll]").forEach(el=>{const k=el.dataset.scroll;if(S.reset[k])el.scrollTop=0;else if(scr[k]!=null)el.scrollTop=scr[k];});
  S.reset={};
  for(const id in keep){const el=document.getElementById(id);if(el){el.value=keep[id].v;if(keep[id].f){el.focus();try{el.setSelectionRange(keep[id].s,keep[id].s);}catch(e){}}}}
  const ta=$("#ptext");if(ta)ta.oninput=e=>{S.pass.raw=e.target.value;};
  const be=$("#briefEdit");if(be)be.oninput=e=>{S.brief.draftEdit=e.target.value;};
  const ai2=$("#askin");if(ai2)ai2.onkeydown=e=>{if(e.key==="Enter"){e.preventDefault();A.askInput();}};
}

/* ---------- journey setup ---------- */
function ensureReady(){
  if(S.pass.status==="draft"&&!S.pass.deleted){S.pass.status="verified";S.pass.raw="";S.pass.redacted="";access("Sandy Leung · Special Assistance","Checked your Passport codes");}
  if(S.pass.status!=="verified"||S.pass.deleted){
    const keepDeleted=false;
    const red=redact(S.pass.raw||DEFAULT_TEXT);
    S.pass=Object.assign(freshPass(),{raw:"",redacted:red.text,removed:red.removed},rulesPassport(S.pass.raw||DEFAULT_TEXT),{status:"verified",source:"rules",consented:true,deleted:keepDeleted});
    access("Sandy Leung · Special Assistance","Checked your Passport codes");
  }
  S.booked=true;S.plan=true;
  if(S.brief.status!=="approved"){S.brief={text:templateBrief(),status:"approved",source:"rules",note:""};}
}
function setDay(n){
  const keep={view:S.view,pass:S.pass,booked:S.booked,plan:S.plan,brief:S.brief,consent:S.consent,accessLog:S.accessLog,chat:S.chat};
  S=Object.assign(fresh(),keep);
  ensureReady();
  S.phase="day";S.clock="Thu 12 Nov · 20:58";
  log("10 Nov","Mum's confirmed plan was sent to her and 6 staff.");
  log("10 Nov","Mum approved what the crew will be told.");
  for(let i=0;i<n;i++)completeStage(true);
  S.p=n>=4?"journey":"home";
}
function completeStage(quiet){
  const s=STAGES[S.done];S.done++;S.clock=s.date+" · "+s.time;log(s.time,s.carer);
  access(s.owner+" · "+s.role,"Scanned your card at "+s.name);
  if(S.done===4&&S.consent.crew&&S.brief.status==="approved")access("Daniel Yip · cabin crew","Opened your approved crew brief");
  S.helpReq=false;S.helpAck=false;
  if(!quiet){toast("carer",s.carer,s.name+" ✓");toast("passenger",s.pass);}
}

/* ---------- actions ---------- */
const A={
  view(v){S.view=v;render();window.scrollTo(0,0);},
  go(p){S.p=p;S.reset.passenger=true;S.panel=null;if(p==="recover"){S.rec=0;S.photo=false;}render();},
  demoOnly(){toast("passenger","That button is for show in this demo.","Demo");render();},
  lang(l){S.pass.lang=l;if(l!=="English"&&!aiOn())toast("passenger","Built-in rules understand English only. AI handles Cantonese and Mandarin.","Language");render();},

  startPassport(){
    const raw=String(S.pass.raw||"").trim();
    if(raw.length<10){toast("passenger","Please describe the help needed in a sentence or two.","Access Passport");render();return;}
    const r=redact(raw);
    Object.assign(S.pass,{raw,redacted:r.text,removed:r.removed,dxLocal:r.dx,status:"consent",consented:false,deleted:false,note:""});
    S.reset.passenger=true;render();},
  consentPass(){S.pass.consented=!S.pass.consented;render();},
  editPassport(){
    if(S.pass.status==="verified"){S.pass.raw=S.pass.summary;}
    S.pass.status="none";S.plan=false;S.brief={text:"",status:"none",source:"",note:""};S.reset.passenger=true;render();},
  async runAI(){
    if(!S.pass.consented)return;
    if(!aiOn()){A.runRules();return;}
    S.pass.status="thinking";render();
    CTL=new AbortController();const ctl=CTL;
    try{
      const r=AI_MODE==="api"?await apiCall("passport",{text:S.pass.redacted},ctl.signal):await aiJSON(passportPrompt(S.pass.redacted),ctl.signal);
      if(S.pass.status!=="thinking")return;
      const cp=cleanPassport(r);cp.removedDx=uniq([...(S.pass.dxLocal||[]),...cp.removedDx]);
      Object.assign(S.pass,cp,{status:"draft",source:"ai",note:""});
      access(AI_MODE==="api"?"AI (Amazon Nova on Amazon Bedrock)":"AI (Claude)","Suggested codes from your redacted words. Nothing kept by this app.");
    }catch(e){
      if(S.pass.status!=="thinking")return;
      Object.assign(S.pass,rulesPassport(S.pass.raw),{status:"draft",source:"rules",note:aiFail(e)});
    }
    toast("staff","New Access Passport to check: Mrs CHAN, CX 255","Passport check");
    S.reset.passenger=true;render();},
  stopAI(){if(CTL)CTL.abort();},
  runRules(){
    if(!S.pass.consented)return;
    Object.assign(S.pass,rulesPassport(S.pass.raw),{status:"draft",source:"rules",note:S.consent.ai?"":"AI is switched off in your privacy settings."});
    toast("staff","New Access Passport to check: Mrs CHAN, CX 255","Passport check");
    S.reset.passenger=true;render();},
  removeCode(i){
    i=Number(i);const c=S.pass.codes[i];if(!c)return;
    if(S.pass.codes.length<=1){toast("staff","A Passport needs at least one code. Use OTHS for anything else.","Passport check");render();return;}
    S.pass.codes.splice(i,1);
    S.pass.evac=S.pass.evac&&(S.pass.codes.some(x=>EVAC_CODES.includes(x.code))||S.pass.source==="ai");
    S.pass.medif=S.pass.codes.some(x=>MEDIF_CODES.includes(x.code))||(S.pass.medif&&S.pass.source==="ai"&&!MEDIF_CODES.includes(c.code));
    render();},
  verify(){
    S.pass.status="verified";S.pass.raw="";S.pass.redacted="";
    access("Sandy Leung · Special Assistance","Checked your Passport codes");
    toast("passenger","Sandy at Cathay checked your Access Passport. Your original words have been deleted.");
    log("22 Oct","Mum's Access Passport was checked by Cathay staff.");render();},

  book(){S.booked=true;S.clock="Thu 22 Oct · 19:52";log("22 Oct","Mum booked CX 255 on 12 Nov, seat 41C.");toast("carer","Mum booked CX 255 · 12 Nov · seat 41C");render();},
  t48(){
    if(S.pass.status!=="verified")return;
    S.plan=true;S.clock="Tue 10 Nov · 23:50";
    log("10 Nov","Mum's confirmed plan was sent to her and 6 staff.");
    access("6 assigned staff","Received your confirmed plan (each sees their own step)");
    toast("passenger","Your assistance is confirmed. Now check what the crew will be told.","Plan confirmed");
    toast("staff","Assigned: Mrs CHAN · CX 255 · 12 Nov","New assignment");
    A.draftBrief();},
  async draftBrief(){
    if(!aiOn()){S.brief={text:templateBrief(),status:"draft",source:"rules",note:S.consent.ai?"":"AI is switched off, so this was written from fixed templates."};render();return;}
    S.brief={text:"",status:"drafting",source:"ai",note:""};render();
    try{
      const t=cleanBrief(AI_MODE==="api"?await apiCall("brief",{facts:{codes:S.pass.codes,summary:S.pass.summary}}):await aiText(briefPrompt()));
      S.brief={text:t,status:"draft",source:"ai",note:""};
    }catch(e){S.brief={text:templateBrief(),status:"draft",source:"rules",note:aiFail(e)};}
    render();},
  redraft(){A.draftBrief();},
  editBrief(){S.brief.status="editing";S.brief.draftEdit=S.brief.text;render();},
  cancelEdit(){S.brief.status="draft";render();},
  saveBrief(){
    let t=String(S.brief.draftEdit==null?S.brief.text:S.brief.draftEdit).replace(/\s+/g," ").trim().slice(0,700);
    if(!t){toast("passenger","The brief can't be empty.");render();return;}
    const had=/evacuation/i.test(t);
    if(S.pass.evac&&!had)t=(t.replace(/\.?$/,".")+" "+EVAC_LINE).trim();
    S.brief={text:t,status:"draft",source:"you",note:S.pass.evac&&!had?"The evacuation line was added back because it's safety information.":""};render();},
  approveBrief(){S.brief.status="approved";S.brief.note="";access("You","Approved the exact wording crew will see");log("10 Nov","Mum approved what the crew will be told.");toast("carer","Mum approved her crew brief.");render();},

  story(d){S.story=Math.max(0,Math.min(STORY.length-1,S.story+Number(d)));render();},
  sound(i){i=Number(i);playLevel(i);S.playing=i;render();setTimeout(()=>{if(S.playing===i){S.playing=-1;render();}},3000);},
  lounge(){S.lounge=!S.lounge;if(S.lounge)toast("passenger","Quiet space reserved near Gate 23. Kelvin will take you there.");render();},
  help(){if(S.phase!=="day"||S.done>=6)return;S.helpReq=true;S.helpAck=false;toast("staff","Mrs Chan pressed \"I'm here, where's my help?\"","Urgent");toast("passenger","Sent. Your assistant and the supervisor have been told.");render();},
  ack(){S.helpAck=true;toast("passenger",cur().owner+" is on the way · about 2 minutes.");render();},
  scan(){if(S.scanning)return;S.scanning=true;render();setTimeout(()=>{S.scanning=false;A.advance();},1300);},
  advance(){
    if(S.phase==="setup"){setDay(0);S.reset={passenger:true,carer:true,staff:true};render();return;}
    if(S.done>=STAGES.length)return;
    completeStage(false);
    if(S.done===4||S.done===5){S.p="journey";S.reset.passenger=true;}
    render();},
  jump(w){
    if(w==="setup"){const keep={view:S.view,pass:S.pass,booked:S.booked,plan:S.plan,brief:S.brief,consent:S.consent,accessLog:S.accessLog,chat:S.chat};S=Object.assign(fresh(),keep);}
    else setDay(w==="day"?0:w==="air"?4:5);
    S.reset={passenger:true,carer:true,staff:true};render();},
  reset(){const v=S.view;if(CTL)CTL.abort();S=fresh();S.view=v;render();},
  delay(){if(S.phase!=="day"||S.done>=4)setDay(1);S.delay="pending";toast("passenger","CX 255 is delayed. We're moving all your help to the new time.","Disruption Guard");toast("carer","CX 255 delayed 55 min. Mum's assistance is being moved.","Disruption Guard");render();},
  approveDelay(){S.delay="approved";toast("passenger","New plan approved. All your help moved with your flight.");toast("carer","New plan approved for Mum.");toast("staff","CX 255 now departs 00:45. Your step moved.");render();},
  capLang(k){S.capLang=k;render();},
  breath(){S.breath=!S.breath;try{if(S.breath&&navigator.vibrate)navigator.vibrate([200,3800,200]);}catch(e){}render();},
  onHelp(){S.onHelp=true;S.crewAck=false;render();setTimeout(()=>{if(S.onHelp&&!S.crewAck&&S.view!=="crew"){S.crewAck=true;toast("passenger","Daniel is coming to 41C.");render();}},6000);},
  crewAck(){S.crewAck=true;toast("passenger","Daniel is coming to 41C.");render();},
  recType(t){S.recType=t;S.rec=1;render();},
  photo(){S.photo=true;render();},
  recNext(){if(S.rec===1&&!S.photo)return;S.rec++;if(S.rec===4){log("06:41","Mum reported damage to her wheelchair. A claims specialist has it.");toast("carer","Mum reported wheelchair damage. A claims specialist has it.");}S.reset.passenger=true;render();},
  refl(a){const [k,v]=a.split(":");S.refl[k]=Number(v);render();},
  fade(v){S.fade=v;render();},

  consent(key){
    S.consent[key]=!S.consent[key];
    const on=S.consent[key];
    const msgs={carer:on?"Carer Mode is on. Mei can follow your journey.":"Carer Mode is off. Mei can no longer see your journey.",
      crew:on?"Crew will see your approved brief.":"Crew will see only your codes and safety information.",
      partners:on?"Partner airlines can read your service codes.":"Your codes stay with Cathay-operated flights.",
      analytics:on?"Anonymous feedback is on.":"Anonymous feedback is off.",
      ai:on?"AI drafting is on. Names and numbers are always removed first.":"AI is off. Built-in rules and templates are used instead."};
    access("You","Turned "+(on?"on":"off")+": "+{carer:"Carer Mode",crew:"crew brief",partners:"partner sharing",analytics:"anonymous feedback",ai:"AI drafting"}[key]);
    if(key==="carer"&&on&&S.phase!=="setup")S.carerLog.unshift({t:S.clock.split("· ")[1]||"",msg:"Mum turned Carer Mode back on."});
    toast("passenger",msgs[key],"Privacy");render();},
  panel(p){S.panel=p||null;render();},
  copyExport(){
    const txt=JSON.stringify(exportData(),null,2);
    const sel=()=>{const el=$("#exportPre");if(el){const r=document.createRange();r.selectNodeContents(el);const s=window.getSelection();s.removeAllRanges();s.addRange(r);}};
    try{navigator.clipboard.writeText(txt).then(()=>{toast("passenger","Copied.","Privacy");render();},()=>{sel();toast("passenger","Selected. Press Ctrl+C or ⌘C to copy.","Privacy");render();});}
    catch(e){sel();}},
  deletePass(){
    S.pass=Object.assign(freshPass(),{raw:"",deleted:true});
    S.brief={text:"",status:"none",source:"",note:""};S.plan=false;S.panel=null;
    S.accessLog=[{t:S.clock,who:"You",what:"Deleted your Access Passport and crew brief"}];
    toast("passenger","Your Access Passport and crew brief were deleted.","Privacy");render();},

  async ask(q){
    q=String(q||"").trim().slice(0,500);if(!q||S.typing)return;
    S.chat.push({from:"me",text:q});
    if(SAFETY_RE.test(q)){
      S.chat.push({from:"sys",text:"Safety or medical question · sent to a person, not the AI"});render();
      setTimeout(()=>{S.chat.push({from:"human",text:"Hi Mrs Chan, I'm Wing from the accessibility team. I'll check this with our specialists for your exact flight and call you today."});render();},1600);
      return;}
    S.typing=true;render();
    let r,live=false;
    try{
      if(!aiOn())throw {code:"ai_off"};
      const hist=S.chat.filter(m=>m.from==="me"||m.from==="ai").slice(-5,-1).map(m=>({role:m.from==="me"?"user":"assistant",text:redact(m.text).text}));
      const raw=AI_MODE==="api"?await apiCall("ask",{question:redact(q).text,history:hist}):await aiJSON(conciergePrompt(redact(q).text),undefined,false);
      if(!raw||typeof raw.answer!=="string"||!raw.answer.trim())throw {code:"invalid_shape"};
      const src=POLICY.some(p=>p.id===raw.source)?raw.source:null;
      let conf=Math.round(Number(raw.confidence));if(!isFinite(conf))conf=0;conf=Math.max(0,Math.min(100,conf));
      r={answer:raw.answer.trim().slice(0,600),source:src,confidence:conf,needs_human:!!raw.needs_human||!src||conf<80};live=true;
    }catch(e){
      r=offlineAnswer(q);
      if(e&&e.code&&e.code!=="ai_off"&&e.code!=="cancelled")S.chat.push({from:"sys",text:aiFail(e).replace("the built-in rules were used","an offline answer was used")});
    }
    S.typing=false;
    S.chat.push({from:"ai",text:r.answer,src:r.source,conf:r.confidence,live});
    if(r.needs_human){
      S.chat.push({from:"sys",text:r.source?"Confidence below 80% · passed to a person":"No matching policy · passed to a person"});
      render();
      setTimeout(()=>{S.chat.push({from:"human",text:"Hi Mrs Chan, I'm Wing from the accessibility team. Let me check that for your exact flight and get back to you within the hour."});render();},1600);
      return;}
    render();},
  askInput(){const el=$("#askin");if(!el||!el.value.trim())return;const q=el.value.trim();el.value="";A.ask(q);}
};

document.addEventListener("click",e=>{const t=e.target.closest("[data-act]");if(!t||t.disabled)return;const f=A[t.dataset.act];if(f)f(t.dataset.arg,t);});
document.addEventListener("keydown",e=>{
  const tg=e.target;
  if(tg&&tg.getAttribute&&tg.getAttribute("role")==="button"&&(e.key==="Enter"||e.key===" ")){e.preventDefault();tg.click();return;}
  if(tg&&(tg.tagName==="TEXTAREA"||tg.tagName==="INPUT"))return;
  if(e.key==="h"||e.key==="H")document.body.classList.toggle("clean");
  if(e.key==="ArrowRight")A.advance();
});
setInterval(()=>{if(S.phase==="day"&&S.done===4&&(S.p==="journey"||S.p==="home")&&(S.view==="stage"||S.view==="passenger")){S.cap++;const el=$("#caps");if(el)el.innerHTML=capLines();}},3200);
render();
connectAI();
</script>
</body>
