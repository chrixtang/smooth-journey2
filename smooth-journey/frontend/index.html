<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">

<style>
/* Layout: a single phone-width app column (full screen on phones, centred on desktop) with a sticky top bar and bottom tabs. Light theme only, like a native app. */
:root{
  color-scheme:light;
  --jade:#0f5e55; --jade-d:#0a463f; --jade-2:#e4f0ec; --jade-3:#c7e1d9;
  --ink:#14201e; --muted:#5b6a66; --line:#dbe4e0; --bg:#f4f7f6; --page:#dfe7e4; --card:#ffffff;
  --sun:#f2c12e; --sun-2:#fff4cf; --red:#c0392b; --red-2:#fde8e5; --amber:#a86800; --amber-2:#fff1d6;
  --ok:#1d7f48; --ok-2:#e0f3e8; --night:#0e1a24; --night-2:#18293a; --violet:#4b3fa8; --violet-2:#ecebfb;
  --font:Inter,"Noto Sans HK",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:var(--page);color:var(--ink);font-family:var(--font);-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
button{font:inherit;cursor:pointer;border:0;background:none;color:inherit}
button:disabled{cursor:not-allowed;opacity:.45}
input,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--sun);outline-offset:2px;border-radius:8px}
h1,h2,h3{text-wrap:balance}
.app{max-width:480px;margin:0 auto;min-height:100%;height:100dvh;background:var(--bg);display:flex;flex-direction:column;position:relative;box-shadow:0 0 0 1px var(--line),0 30px 80px -30px rgba(10,40,35,.35)}
.bar{position:sticky;top:0;z-index:20;background:var(--bg);padding:calc(env(safe-area-inset-top,0px) + 10px) 16px 8px;display:flex;align-items:center;gap:10px}
.bar .t{flex:1;min-width:0}
.bar .t small{display:block;font-size:12px;color:var(--muted);font-weight:600}
.bar .t b{display:block;font-size:20px;font-weight:800;letter-spacing:-.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.avatar{width:38px;height:38px;border-radius:50%;background:var(--jade);color:#fff;font-weight:800;display:grid;place-items:center;flex:0 0 38px}
main{flex:1;overflow-y:auto;overflow-x:hidden;padding:4px 16px 24px;-webkit-overflow-scrolling:touch}
.tabs{display:flex;justify-content:space-around;border-top:1px solid var(--line);background:#fff;padding:6px 4px calc(env(safe-area-inset-bottom,0px) + 6px)}
.tabs button{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;font-weight:600;color:var(--muted);padding:4px 6px;min-width:58px;position:relative}
.tabs button .ic{font-size:20px;line-height:1}
.tabs button.on{color:var(--jade)}
.tabs .dot{position:absolute;top:2px;right:12px;width:9px;height:9px;border-radius:50%;background:var(--red)}
.stack{display:flex;flex-direction:column;gap:12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px}
.card.jade{background:var(--jade);color:#fff;border-color:var(--jade)}
.card.soft{background:var(--jade-2);border-color:var(--jade-3)}
.card.sun{background:var(--sun-2);border-color:#f0dc95}
.card.warn{background:var(--amber-2);border-color:#f1d39b}
.card.bad{background:var(--red-2);border-color:#f2c0b9}
.card.ai{background:var(--violet-2);border-color:#d3cff3}
.card.night{background:var(--night);color:#e7eef5;border-color:var(--night)}
.card h3{font-size:16px;font-weight:700;margin-bottom:4px}
.card h2{font-size:20px;font-weight:800;letter-spacing:-.01em;margin-bottom:4px}
.card p{font-size:14px;line-height:1.5}
.small{font-size:12.5px;color:var(--muted);line-height:1.45}
.card.jade .small,.card.night .small{color:#bfe0d7}
.row{display:flex;align-items:center;gap:10px}
.between{justify-content:space-between}
.wrap{flex-wrap:wrap}
.mt{margin-top:10px}.mt2{margin-top:16px}
.btn{display:block;width:100%;background:var(--jade);color:#fff;font-weight:700;font-size:16px;padding:14px;border-radius:14px;text-align:center}
.btn.sec{background:var(--jade-2);color:var(--jade)}
.btn.sun{background:var(--sun);color:#1b1b1b}
.btn.red{background:var(--red);color:#fff}
.btn.ghost{background:#fff;border:1.5px solid var(--line);color:var(--ink)}
.btn.ai{background:var(--violet);color:#fff}
.btn.sm{font-size:14px;padding:10px 12px;border-radius:10px}
.btn.inline{display:inline-block;width:auto}
.link{color:var(--jade);font-weight:700;font-size:14px;text-decoration:underline;text-underline-offset:2px}
.pill{white-space:nowrap;flex:0 0 auto;display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:700;padding:4px 9px;border-radius:999px;background:var(--jade-2);color:var(--jade)}
.pill.ok{background:var(--ok-2);color:var(--ok)}.pill.amber{background:var(--amber-2);color:var(--amber)}.pill.red{background:var(--red-2);color:var(--red)}.pill.grey{background:#eef1f0;color:var(--muted)}.pill.ai{background:var(--violet-2);color:var(--violet)}
.code{font-family:var(--mono);font-weight:800;font-size:13px;background:var(--ink);color:#fff;border-radius:6px;padding:3px 7px;flex:0 0 auto}
.code.off{background:#c9d3d0;text-decoration:line-through}
.codes{display:flex;gap:6px;flex-wrap:wrap}
.list{list-style:none}
.list li{display:flex;gap:10px;padding:10px 0;border-top:1px solid var(--line);font-size:14px;align-items:flex-start;line-height:1.4}
.list li:first-child{border-top:0}
.chk{width:24px;height:24px;border-radius:50%;flex:0 0 24px;display:grid;place-items:center;font-size:12px;font-weight:800;background:#eef1f0;color:var(--muted)}
.chk.ok{background:var(--ok);color:#fff}.chk.now{background:var(--sun);color:#1b1b1b}
label.f{display:block;font-size:13px;font-weight:700;margin:12px 0 6px}
input.f,textarea.f{width:100%;border:1.5px solid var(--line);border-radius:12px;padding:12px;font-size:16px;background:#fff}
textarea.f{min-height:150px;line-height:1.45;resize:vertical}
input.f:focus,textarea.f:focus{border-color:var(--jade);outline:none}
input.codein{font-family:var(--mono);font-size:24px;letter-spacing:.3em;text-align:center;text-transform:uppercase}
.choice{display:flex;gap:12px;align-items:flex-start;width:100%;text-align:left;border:1.5px solid var(--line);background:#fff;border-radius:14px;padding:12px;margin-top:8px}
.choice.on{border-color:var(--jade);background:var(--jade-2)}
.box{width:22px;height:22px;flex:0 0 22px;border-radius:6px;border:2px solid var(--muted);display:grid;place-items:center;font-weight:800;color:#fff;font-size:13px}
.radio{border-radius:50%}
.choice.on .box{background:var(--jade);border-color:var(--jade)}
.err{background:var(--red-2);color:var(--red);border-radius:12px;padding:10px 12px;font-size:14px;font-weight:600;margin-top:10px}
.sw{width:48px;height:28px;border-radius:999px;background:#c9d3d0;position:relative;flex:0 0 48px;transition:background .2s}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;transition:left .2s;box-shadow:0 1px 3px rgba(0,0,0,.2)}
.sw[aria-checked="true"]{background:var(--jade)}.sw[aria-checked="true"]::after{left:23px}
.swrow{display:flex;gap:12px;align-items:center;padding:12px 0;border-top:1px solid var(--line)}
.swrow:first-of-type{border-top:0}
.swrow .tx{flex:1;min-width:0}.swrow .tx b{display:block;font-size:14px}
.redact{background:#eef1f0;border-radius:12px;padding:10px;font-size:14px;line-height:1.5;white-space:pre-wrap;word-break:break-word}
.redact mark{background:var(--ink);color:#fff;border-radius:4px;padding:0 4px;font-size:12px;font-family:var(--mono)}
.tl .st{display:flex;gap:12px;position:relative;padding-bottom:16px}
.tl .st:not(:last-child)::before{content:"";position:absolute;left:11px;top:26px;bottom:0;width:2px;background:var(--line)}
.tl .st.done:not(:last-child)::before{background:var(--ok)}
.tl .t{font-size:14px;font-weight:700}.tl .s{font-size:12.5px;color:var(--muted);margin-top:2px}
.tl .st.now .t{color:var(--jade)}
.prog{display:flex;gap:4px}.prog span{flex:1;height:6px;border-radius:9px;background:rgba(255,255,255,.3)}
.prog span.d{background:#fff}.prog span.n{background:var(--sun)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom,0px) + 84px);z-index:50;background:rgba(20,32,30,.96);color:#fff;border-radius:14px;padding:12px 16px;font-size:14px;max-width:min(440px,calc(100% - 32px));box-shadow:0 10px 25px -8px rgba(0,0,0,.4)}
.toast.anim{animation:up .3s ease}
@keyframes up{from{transform:translate(-50%,10px);opacity:0}to{transform:translate(-50%,0);opacity:1}}
.chat{display:flex;flex-direction:column;gap:8px}
.msg{max-width:86%;padding:10px 12px;border-radius:16px;font-size:14px;line-height:1.45;word-break:break-word}
.msg.me{align-self:flex-end;background:var(--jade);color:#fff;border-bottom-right-radius:4px}
.msg.ai{align-self:flex-start;background:#fff;border:1px solid var(--line);border-bottom-left-radius:4px}
.msg.human{align-self:flex-start;background:var(--sun-2);border:1px solid #f0dc95;border-bottom-left-radius:4px}
.msg.sys{align-self:center;font-size:12px;color:var(--muted);text-align:center}
.src{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin-top:7px}
.chatin{display:flex;gap:8px;position:sticky;bottom:0;background:var(--bg);padding:10px 0 4px}
.chatin input{flex:1;min-width:0;border:1.5px solid var(--line);border-radius:999px;padding:11px 14px;font-size:16px;background:#fff}
.chatin button{background:var(--jade);color:#fff;border-radius:999px;padding:0 18px;font-weight:700}
.kpis{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.kpi{background:#fff;border:1px solid var(--line);border-radius:14px;padding:12px}
.kpi b{display:block;font-size:26px;font-weight:800;font-variant-numeric:tabular-nums}
.kpi span{font-size:12px;color:var(--muted);font-weight:600}
.kpi.alert{border-color:#f2c0b9;background:var(--red-2)}
.tscroll{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:13px}
th{text-align:left;font-size:11px;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.05em;padding:6px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:8px 6px;border-bottom:1px solid #edf1ef;vertical-align:top}
.story{background:var(--jade-2);border-radius:18px;padding:20px;text-align:center;min-height:190px;display:flex;flex-direction:column;justify-content:center;gap:10px}
.story .em{font-size:60px;line-height:1}
.breath{width:140px;height:140px;margin:10px auto 4px;border-radius:50%;background:radial-gradient(circle,#5fd0bb 0,#1f7d70 70%);animation:breath 8s ease-in-out infinite;display:grid;place-items:center;color:#fff;font-weight:700;font-size:14px}
@keyframes breath{0%,100%{transform:scale(.62)}50%{transform:scale(1)}}
.hero{padding:calc(env(safe-area-inset-top,0px) + 40px) 24px 24px;text-align:center}
.logo{width:76px;height:76px;margin:0 auto 14px;border-radius:22px;background:url(/icon-192.png) center/cover}
.hero h1{font-size:32px;font-weight:800;letter-spacing:-.03em}
.hero p{color:var(--muted);font-size:15px;line-height:1.5;margin-top:8px}
.demo{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.demo button{background:#fff;border:1.5px solid var(--line);border-radius:12px;padding:10px;text-align:left;font-size:13px;line-height:1.3}
.demo button b{display:block;font-size:14px}
.notice{font-size:12px;color:var(--muted);text-align:center;line-height:1.5;padding:8px 8px 0}
.dots::after{content:"";animation:dots 1.2s steps(4) infinite}
@keyframes dots{0%{content:""}25%{content:"."}50%{content:".."}75%{content:"..."}}
.sheetbg{position:fixed;inset:0;background:rgba(10,20,18,.4);z-index:40;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--bg);width:100%;max-width:480px;border-radius:22px 22px 0 0;padding:20px 16px calc(env(safe-area-inset-bottom,0px) + 20px);max-height:88dvh;overflow-y:auto}
.sheet.anim{animation:sheet .25s ease}
@keyframes sheet{from{transform:translateY(40px);opacity:0}to{transform:none;opacity:1}}
pre.export{background:#0f1c1a;color:#d6efe7;border-radius:12px;padding:12px;font-size:11px;line-height:1.45;overflow:auto;max-height:280px;white-space:pre-wrap;word-break:break-word}
.bars{display:flex;gap:2px;align-items:flex-end;height:60px}
.bars i{flex:1;background:var(--jade-3);border-radius:2px 2px 0 0;display:block}
.bars i.pk{background:var(--jade)}
@media (min-width:520px){.app{margin:24px auto;height:calc(100dvh - 48px);border-radius:28px;overflow:hidden}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style>

<body>
<div class="app" id="app"></div>
<script>
"use strict";
/* =====================================================================
   Smooth Journey — the real app (signed-in, per role).
   Sign-in: Amazon Cognito. Data: our API (/api/state, /api/action).
   Personal details are removed in this browser before text is sent,
   and again on the server. Nothing is kept in browser storage except
   the sign-in refresh token, so you stay signed in.
   ===================================================================== */
const CFG = window.SJ_CONFIG || {};
const CONFIGURED = !!(CFG.region && CFG.clientId);
const AUTH_URL = CONFIGURED ? "https://cognito-idp." + CFG.region + ".amazonaws.com/" : "";
const $ = (s) => document.querySelector(s);
const esc = (s) => String(s == null ? "" : s).replace(/[&<>"']/g, (m) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[m]));
const store = {
  get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } },
  set(k, v) { try { localStorage.setItem(k, v); } catch (e) {} },
  del(k) { try { localStorage.removeItem(k); } catch (e) {} }
};

/* ---------- privacy: same redaction as the server ---------- */
const DX = ["dementia","alzheimer","parkinson","stroke","epilepsy","epileptic","autism","autistic","adhd","diabetes","diabetic","cancer","schizophrenia","bipolar","depression","multiple sclerosis","arthritis","cerebral palsy","copd","heart failure","heart condition","hiv","down syndrome","glaucoma","macular degeneration","ptsd","anxiety disorder","panic disorder"];
function redact(text) {
  let t = String(text || ""); const removed = [];
  const rules = [
    [/[A-Z0-9._%+-]+@[A-Z0-9.-]+\.[A-Z]{2,}/gi, "[email]", "email address"],
    [/\b[A-Z]{1,2}\d{6}\s?\(?[0-9A]\)?/g, "[ID number]", "ID number"],
    [/\b[A-Z]{1,2}\d{7,8}\b/g, "[document number]", "document number"],
    [/\+?\d[\d\s()-]{6,}\d/g, "[phone]", "phone number", (m) => (m.match(/\d/g) || []).length >= 8],
    [/\b(?:Mrs|Mr|Ms|Miss|Mdm|Madam|Dr)\.?\s+[A-Z][a-zA-Z'-]+(?:\s+[A-Z][a-zA-Z'-]+)*/g, "[name]", "name"],
    [/\(\s*\d{1,3}\s*\)|\baged?\s+\d{1,3}\b|\b\d{1,3}\s*(?:years?[\s-]old|y\/o|yo)\b/gi, "[age]", "age"],
    [/\b\d{1,2}\s*(?:歲|岁)/g, "[age]", "age"]
  ];
  for (const [re, rep, label, test] of rules) t = t.replace(re, (m) => { if (test && !test(m)) return m; removed.push(label); return rep; });
  for (const w of DX) t = t.replace(new RegExp("\\b" + w.replace(/ /g, "\\s+") + "\\w*", "gi"), () => { removed.push("condition names"); return "[condition]"; });
  return { text: t, removed: [...new Set(removed)] };
}
const marks = (s) => esc(s).replace(/\[(name|age|phone|email|ID number|document number|condition)\]/g, "<mark>$1</mark>");

/* ---------- UI state ---------- */
const UI = { screen: "welcome", tab: null, sub: null, busy: "", err: "", toast: "", sheet: null,
  form: {}, pendingEmail: "", pendingPassword: "", role: "passenger", ack: false,
  passStep: "form", passText: "", passConsent: false, editBrief: null, removeCodes: {}, chat: [], typing: false,
  story: 0, capIdx: 0, breath: false, report: null, refl: {}, flights: null, flightsState: "idle", exportOpen: false, confirmDelete: false };
let SESSION = null, STATE = null, STATE_JSON = "", INSTALL = null, toastTimer = null;

function toast(t) { UI.toast = t; clearTimeout(toastTimer); toastTimer = setTimeout(() => { UI.toast = ""; render(); }, 3500); render(); }
function initials(n) { return String(n || "?").split(/\s+/).filter(Boolean).slice(0, 2).map((w) => w[0]).join("").toUpperCase(); }
function fmtTime(iso) { try { return new Date(iso).toLocaleString("en-GB", { day: "numeric", month: "short", hour: "2-digit", minute: "2-digit" }); } catch (e) { return ""; } }
function fmtDate(d) { try { return new Date(d + "T00:00:00").toLocaleDateString("en-GB", { weekday: "short", day: "numeric", month: "short" }); } catch (e) { return d; } }

/* ---------- Cognito (direct API calls, no library) ---------- */
async function cognito(target, body) {
  const r = await fetch(AUTH_URL, { method: "POST", headers: { "Content-Type": "application/x-amz-json-1.1", "X-Amz-Target": "AWSCognitoIdentityProviderService." + target }, body: JSON.stringify(body) });
  const d = await r.json().catch(() => ({}));
  if (!r.ok) throw { code: String(d.__type || "").split("#").pop(), message: d.message || "" };
  return d;
}
function authMsg(e) {
  const c = e && e.code;
  return ({
    NotAuthorizedException: "That email and password don't match.",
    UserNotConfirmedException: "Please verify your email first.",
    UsernameExistsException: "There's already an account with that email. Try signing in.",
    CodeMismatchException: "That code isn't right. Check the email and try again.",
    ExpiredCodeException: "That code has expired. Ask for a new one.",
    InvalidPasswordException: "Use at least 8 characters with an upper-case letter, a lower-case letter and a number.",
    LimitExceededException: "Too many tries. Please wait a few minutes.",
    TooManyRequestsException: "Too many tries. Please wait a few minutes.",
    InvalidParameterException: "Please check the details you entered.",
    UserNotFoundException: "That email and password don't match."
  })[c] || (e && e.message) || "Something went wrong. Please try again.";
}
function decode(jwt) { try { const p = jwt.split(".")[1].replace(/-/g, "+").replace(/_/g, "/"); return JSON.parse(decodeURIComponent(escape(atob(p)))); } catch (e) { return {}; } }
function setSession(res, refresh) {
  const c = decode(res.IdToken);
  const g = c["cognito:groups"] || [];
  const role = ["supervisor", "crew", "staff", "carer", "passenger"].find((r) => g.includes(r)) || null;
  SESSION = { id: res.IdToken, access: res.AccessToken, refresh: refresh || res.RefreshToken, exp: (c.exp || 0) * 1000, email: c.email || "", name: c.name || "", role };
  if (SESSION.refresh) store.set("sj.rt", SESSION.refresh);
}
async function signIn(email, password) {
  const d = await cognito("InitiateAuth", { AuthFlow: "USER_PASSWORD_AUTH", ClientId: CFG.clientId, AuthParameters: { USERNAME: email, PASSWORD: password } });
  if (!d.AuthenticationResult) throw { code: "Challenge", message: "This account needs an administrator to finish setting it up." };
  setSession(d.AuthenticationResult);
}
async function refresh() {
  const rt = (SESSION && SESSION.refresh) || store.get("sj.rt");
  if (!rt || !CONFIGURED) return false;
  try { const d = await cognito("InitiateAuth", { AuthFlow: "REFRESH_TOKEN_AUTH", ClientId: CFG.clientId, AuthParameters: { REFRESH_TOKEN: rt } }); setSession(d.AuthenticationResult, rt); return true; }
  catch (e) { store.del("sj.rt"); SESSION = null; return false; }
}
async function signOut(silent) {
  const rt = SESSION && SESSION.refresh;
  SESSION = null; STATE = null; STATE_JSON = ""; store.del("sj.rt");
  Object.assign(UI, { screen: "welcome", tab: null, sub: null, sheet: null, chat: [], passStep: "form", passText: "", editBrief: null, err: "", flights: null, flightsState: "idle" });
  if (rt) cognito("RevokeToken", { Token: rt, ClientId: CFG.clientId }).catch(() => {});
  render();
  if (!silent) toast("Signed out.");
}

/* ---------- our API ---------- */
async function api(path, body, retried) {
  if (!SESSION) throw { code: "signed_out" };
  if (SESSION.exp - Date.now() < 60000) await refresh();
  if (!SESSION) throw { code: "signed_out" };
  let r;
  try { r = await fetch("/api/" + path, { method: "POST", headers: { "content-type": "application/json", authorization: "Bearer " + SESSION.id }, body: JSON.stringify(body || {}) }); }
  catch (e) { throw { code: "offline" }; }
  if (r.status === 401 && !retried) { if (await refresh()) return api(path, body, true); signOut(true); throw { code: "signed_out" }; }
  const d = await r.json().catch(() => ({}));

/* ---------- sound ladder ---------- */
let AC;
function playLevel(i) {
  try { AC = AC || new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { return; }
  const now = AC.currentTime;
  if (i === 1) { [880, 660].forEach((f, k) => { const o = AC.createOscillator(), g = AC.createGain(); o.frequency.value = f; const t = now + k * .6; g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(.18, t + .02); g.gain.exponentialRampToValueAtTime(.001, t + 1.2); o.connect(g).connect(AC.destination); o.start(t); o.stop(t + 1.3); }); return; }
  const len = AC.sampleRate * 3, buf = AC.createBuffer(1, len, AC.sampleRate), d = buf.getChannelData(0); let last = 0;
  for (let j = 0; j < len; j++) { const w = Math.random() * 2 - 1; last = (last + .02 * w) / 1.02; d[j] = last * 3.5; }
  const src = AC.createBufferSource(); src.buffer = buf; const lp = AC.createBiquadFilter(); lp.type = "lowpass"; lp.frequency.value = [400, 0, 900, 1600, 3200][i];
  const g = AC.createGain(); const v = [.15, 0, .35, .55, .8][i]; g.gain.setValueAtTime(0, now); g.gain.linearRampToValueAtTime(v, now + .5); g.gain.setValueAtTime(v, now + 2.4); g.gain.linearRampToValueAtTime(0, now + 3);
  src.connect(lp).connect(g).connect(AC.destination); src.start();
}

document.addEventListener("click", (e) => {

  if (!t || t.disabled) return;
  if (t.dataset.act === "sheetClose" && e.target.closest("[data-stop]")) return;   // clicks inside the sheet don't close it
  const f = A[t.dataset.act]; if (f) f(t.dataset.arg, t, e);
});
document.addEventListener("keydown", (e) => {
  const t = e.target;
  if (t && t.getAttribute && t.getAttribute("role") === "button" && (e.key === "Enter" || e.key === " ")) { e.preventDefault(); t.click(); }
  if (e.key === "Escape" && UI.sheet) { UI.sheet = null; render(); }
  if (e.key === "Enter" && t && t.id === "fPass") { e.preventDefault(); if (UI.screen === "signin") A.signin(); else if (UI.screen === "signup" && UI.ack) A.signup(); else if (UI.screen === "reset") A.reset(); }

});
window.addEventListener("beforeinstallprompt", (e) => { e.preventDefault(); INSTALL = e; render(); });
setInterval(() => { if (SESSION && UI.screen === "app" && document.visibilityState === "visible" && !UI.busy && UI.editBrief == null) loadState(true); }, 4000);
document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible" && SESSION) loadState(true); });
if ("serviceWorker" in navigator && location.protocol === "https:") navigator.serviceWorker.register("/sw.js").catch(() => {});

/* ---------- start ---------- */
(async function start() {
  render();
  if (CONFIGURED && store.get("sj.rt")) { if (await refresh()) await enterApp(); else render(); }
})();
</script>
